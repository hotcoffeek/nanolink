publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  crypto: ^3.0.5
  dartssh2: ^4.1.0
  smb_connect: ^0.0.9

flutter:
  uses-material-design: true
