name: Build NanoLink

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        run: |
          mkdir -p /tmp/keep && cp -r lib /tmp/keep/lib && cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --org com.nanolink --project-name nanolink --platforms=windows .
          rm -rf lib && cp -r /tmp/keep/lib lib && cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf test
      - run: flutter pub get
      - name: Set window title
        run: |
          sed -i 's/L"nanolink"/L"NanoLink"/g' windows/runner/main.cpp || true
      - run: flutter build windows --release
      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NanoLink-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NanoLink-windows
          path: NanoLink-windows.zip

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        run: |
          mkdir -p /tmp/keep && cp -r lib /tmp/keep/lib && cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --org com.nanolink --project-name nanolink --platforms=android .
          rm -rf lib && cp -r /tmp/keep/lib lib && cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf test
          cp -r overlay/android/. android/
      - name: Add jcifs-ng (SMB library for SmbBridge.kt)
        run: |
          if ! grep -rq "jcifs" android/app/build.gradle* ; then
            if [ -f android/app/build.gradle.kts ]; then
              printf '\ndependencies {\n    implementation("eu.agno3.jcifs:jcifs-ng:2.1.10")\n}\n' >> android/app/build.gradle.kts
            else
              printf '\ndependencies {\n    implementation "eu.agno3.jcifs:jcifs-ng:2.1.10"\n}\n' >> android/app/build.gradle
            fi
          fi
          tail -5 android/app/build.gradle*
      - run: flutter pub get
      - name: Patch dartssh2 for new Dart
        run: |
          F=$(find $HOME/.pub-cache -path '*dartssh2-2.14.0/lib/src/sftp/sftp_client.dart' | head -1)
          echo "patching $F"
          sed -i -E 's/(if \(bytess?Recieved >= length)\) \{/\1!) {/' "$F"
          grep -n "Recieved >= length" "$F"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: NanoLink-android
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Linux / Steam Deck (.tar.gz)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform folders
        run: |
          mkdir -p /tmp/keep && cp -r lib /tmp/keep/lib && cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --org com.nanolink --project-name nanolink --platforms=linux .
          rm -rf lib && cp -r /tmp/keep/lib lib && cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf test
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf NanoLink-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: NanoLink-linux
          path: NanoLink-linux.tar.gz

  # публикует APK и Linux-сборку в Releases: оттуда их без входа в GitHub качает Coffee Tweaker
  # (ссылки вида https://github.com/<владелец>/nanolink/releases/latest/download/NanoLink.apk)
  release:
    name: Publish release
    needs: [windows, android, linux]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir out
          cp dist/NanoLink-android/app-release.apk out/NanoLink.apk
          if [ -f dist/NanoLink-linux/NanoLink-linux.tar.gz ]; then cp dist/NanoLink-linux/NanoLink-linux.tar.gz out/; fi
          if [ -f dist/NanoLink-windows/NanoLink-windows.zip ]; then cp dist/NanoLink-windows/NanoLink-windows.zip out/; fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NanoLink build ${{ github.run_number }}
          make_latest: true
          files: out/*
